<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdail - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .cart-header h1 {
            font-size: 32px;
            color: #2c3e50;
            margin: 0;
        }

        .back-to-shop {
            background: #f0f0f0;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-to-shop:hover {
            background: #e0e0e0;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            background: white;
            border-radius: 8px;
            padding: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-cart svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-cart p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .empty-cart a {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 30px;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
        }

        .empty-cart a:hover {
            background: #45a049;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .item-price {
            font-size: 16px;
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .quantity-btn {
            background: white;
            border: 1px solid #ddd;
            width: 30px;
            height: 30px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .quantity-btn:hover {
            background: #f0f0f0;
        }

        .quantity-display {
            min-width: 30px;
            text-align: center;
        }

        .item-total {
            color: #666;
            font-size: 14px;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        .cart-summary {
            background: white;
            border-radius: 8px;
            padding: 25px;
            height: fit-content;
            border: 1px solid #e0e0e0;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: #555;
        }

        .summary-row.total {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }

        .checkout-btn {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #45a049;
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: relative;
                top: 0;
            }

            .cart-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .cart-item {
                flex-direction: column;
            }

            .item-image {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <button class="back-to-shop" onclick="window.location.href='index.html'">← Back to Shop</button>
        </div>

        <div class="cart-content">
            <!-- Cart Items List -->
            <div class="cart-items" id="cart-items-list">
                <div class="empty-cart" id="empty-cart-message">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <p>Your cart is empty</p>
                    <p style="font-size: 14px; margin-bottom: 20px;">Add some items to get started!</p>
                    <a href="index.html">Continue Shopping</a>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <div class="summary-title">Order Summary</div>
                
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee:</span>
                    <span id="delivery-fee">Free</span>
                </div>
                <div class="summary-row">
                    <span>Tax (5%):</span>
                    <span id="tax">₹0</span>
                </div>

                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total-amount">₹0</span>
                </div>

                <button class="checkout-btn" id="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './source/supabaseClient.js';
        import { getCurrentUser } from './source/auth.js';

        let cartItems = [];
        let currentUser = null;

        // Initialize cart
        async function initCart() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                currentUser = user;

                if (!currentUser) {
                    window.location.href = './source/Login.html';
                    return;
                }

                console.log('Loading cart for user:', currentUser.email);
                await displayCart();
            } catch (error) {
                console.error('Error initializing cart:', error);
            }
        }

        async function displayCart() {
            try {
                // Fetch cart items
                const { data, error } = await supabase
                    .from('carts')
                    .select('*')
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                cartItems = data || [];
                console.log('Cart items:', cartItems);

                const cartItemsList = document.getElementById('cart-items-list');
                const emptyMessage = document.getElementById('empty-cart-message');

                if (cartItems.length === 0) {
                    cartItemsList.innerHTML = '';
                    cartItemsList.appendChild(emptyMessage);
                } else {
                    cartItemsList.innerHTML = '';
                    cartItems.forEach(item => {
                        const itemHTML = `
                            <div class="cart-item" data-cart-id="${item.id}">
                                <div class="item-image">
                                    <div style="width: 100%; height: 100%; background: #e0e0e0; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #999;">
                                        📦
                                    </div>
                                </div>
                                <div class="item-details">
                                    <div class="item-name">${item.product_name}</div>
                                    <div class="item-price">₹${parseFloat(item.price_at_add).toFixed(2)}</div>
                                    <div class="item-quantity">
                                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                                        <div class="quantity-display" data-qty="${item.id}">${item.quantity}</div>
                                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                                    </div>
                                    <div class="item-total">Total: ₹${(parseFloat(item.price_at_add) * item.quantity).toFixed(2)}</div>
                                </div>
                                <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
                            </div>
                        `;
                        cartItemsList.innerHTML += itemHTML;
                    });
                }

                updateSummary();
            } catch (error) {
                console.error('Error displaying cart:', error);
                alert('Error loading cart: ' + error.message);
            }
        }

        window.updateQuantity = async function(cartId, change) {
            try {
                const item = cartItems.find(i => i.id === cartId);
                if (!item) return;

                const newQuantity = Math.max(1, item.quantity + change);

                const { error } = await supabase
                    .from('carts')
                    .update({ quantity: newQuantity })
                    .eq('id', cartId)
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                item.quantity = newQuantity;
                await displayCart();
            } catch (error) {
                console.error('Error updating quantity:', error);
                alert('Error updating quantity: ' + error.message);
            }
        };

        window.deleteItem = async function(cartId) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            try {
                const { error } = await supabase
                    .from('carts')
                    .delete()
                    .eq('id', cartId)
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                cartItems = cartItems.filter(i => i.id !== cartId);
                await displayCart();
                console.log('Item deleted successfully');
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Error deleting item: ' + error.message);
            }
        };

        function updateSummary() {
            const subtotal = cartItems.reduce((sum, item) => sum + (parseFloat(item.price_at_add) * item.quantity), 0);
            const tax = subtotal * 0.05;
            const deliveryFee = subtotal > 199 ? 0 : 0; // Free delivery
            const total = subtotal + tax + deliveryFee;

            document.getElementById('subtotal').textContent = '₹' + subtotal.toFixed(2);
            document.getElementById('delivery-fee').textContent = deliveryFee === 0 ? 'Free' : '₹' + deliveryFee.toFixed(2);
            document.getElementById('tax').textContent = '₹' + tax.toFixed(2);
            document.getElementById('total-amount').textContent = '₹' + total.toFixed(2);

            // Enable/disable checkout button
            const checkoutBtn = document.getElementById('checkout-btn');
            checkoutBtn.disabled = cartItems.length === 0;
        }

        window.proceedToCheckout = async function() {
            if (cartItems.length === 0) {
                alert('Your cart is empty');
                return;
            }

            // Store cart data in sessionStorage to pass to checkout
            const total = cartItems.reduce((sum, item) => sum + (parseFloat(item.price_at_add) * item.quantity), 0);
            const tax = total * 0.05;
            const finalTotal = total + tax;

            sessionStorage.setItem('cartItems', JSON.stringify(cartItems));
            sessionStorage.setItem('cartTotal', finalTotal.toFixed(2));

            window.location.href = 'checkout.html';
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initCart);
    </script>
</body>
</html>
