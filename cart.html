<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdail - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .cart-header h1 {
            font-size: 32px;
            color: #2c3e50;
            margin: 0;
        }

        .back-to-shop {
            background: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-to-shop:hover {
            background: #3f9443;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            background: white;
            border-radius: 8px;
            padding: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-cart svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-cart p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .empty-cart a {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 30px;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
        }

        .empty-cart a:hover {
            background: #45a049;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .item-price {
            font-size: 16px;
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .quantity-btn {
            background: white;
            border: 1px solid #ddd;
            width: 30px;
            height: 30px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .quantity-btn:hover {
            background: #f0f0f0;
        }

        .quantity-display {
            min-width: 30px;
            text-align: center;
        }

        .item-total {
            color: #666;
            font-size: 14px;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff5f5f 0%, #e63946 100%);
            color: white;
            border: none;
            align-self: center;
            min-width: 84px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #ff4a4a 0%, #cf2f3c 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(207, 47, 60, 0.32);
        }

        .delete-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(207, 47, 60, 0.24);
        }

        .cart-summary {
            background: white;
            border-radius: 8px;
            padding: 25px;
            height: fit-content;
            border: 1px solid #e0e0e0;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: #555;
        }

        .summary-row.total {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }

        .checkout-btn {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #45a049;
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: relative;
                top: 0;
            }

            .cart-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .cart-item {
                flex-direction: column;
            }

            .item-image {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <button class="back-to-shop" onclick="window.location.href='index.html'">← Back to Shop</button>
        </div>

        <div class="cart-content">
            <!-- Cart Items List -->
            <div class="cart-items" id="cart-items-list">
                <div class="empty-cart" id="empty-cart-message">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <p>Your cart is empty</p>
                    <p style="font-size: 14px; margin-bottom: 20px;">Add some items to get started!</p>
                    <a href="index.html">Continue Shopping</a>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <div class="summary-title">Order Summary</div>
                
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee:</span>
                    <span id="delivery-fee">Free</span>
                </div>
                <div class="summary-row">
                    <span>Tax (5%):</span>
                    <span id="tax">₹0</span>
                </div>

                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total-amount">₹0</span>
                </div>

                <button class="checkout-btn" id="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script type="module" src="./source/cartPage.js"></script>
</body>
</html>
