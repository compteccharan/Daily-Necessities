    <style>
        body{
         margin:0;

        }   
               
        .Home-page-header{
            margin-top: 15px;
            padding-bottom:20px;
            border-bottom: 1px solid  rgb(190, 186, 186);
            
           
        }
          
       .header-top-portion{
            border:none;
            height:50px;
            display:flex;
            justify-content:space-between;
        }

       .logo{
          width:280px;
          height: 60px;
          text-align:center;
          padding-top:13px; 
          display:flex;
          justify-content: center;
          align-items: center;
        }

       

       .search-bar{
          border:1px solid rgb(153, 152, 152);
          border-radius: 45px;
          padding:10px 8px;
          width:660px;
          height:40px;
          margin-top: 4px;
          display:flex;
          justify-content: center;
          align-items: center;
          box-sizing: border-box;
          background-color: white;
       }

       .search-box{
        border:none;
        outline:none;
        flex:1;
        font-size:17px;
        max-width:600px;
        padding-left:10px;
        padding-top: 4px;
              }

       .search-icon{
        width:18px;
        height:18px;
        border:none;
        padding:0;
        padding-left:6px;
       }

       .login-cart{
          width:300px;
          text-align:center;
          padding-top:13px; 
       }

       .navigation-bar{
        display:flex;
        justify-content:center;
        align-items:end;
        white-space: nowrap;
        flex-wrap:nowrap;
        column-gap: 45px;
        height:44px;
        margin-top: 3px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgb(190, 186, 186);
       
       }
     
     .navigation-bar > button{
        background-color: white;
        border:none;
        display:flex;
        align-items: flex-end;
        column-gap: 4px;
        cursor:pointer;
        padding:3px 6px;
        border-radius: 5px;
     }
     
     .navigation-bar  button a{
        text-decoration: none;
        font-family:"Rubik",sans-serif;
        font-weight: 430;
        font-size:19px;
        color:rgb(133,133,133);
        transition: color 0.15s, opacity 0.15s;
     }

      button a:active{
        opacity:0.7;
         color:green;
      }

     .navigation-bar button img{
        width:28px;
     }

     .navigation-bar button svg{
        width:28px;
        align-items: center;
     }
