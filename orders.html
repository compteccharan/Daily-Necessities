<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdail - My Orders</title>
    <base href="/Daily-Necessities/">
    <link rel="stylesheet" href="/Daily-Necessities/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        .orders-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .orders-header h1 {
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .orders-header p {
            color: #ffffff !important;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            background: #4CAF50;
            border: 1px solid #4CAF50;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #3f9443;
        }

        .orders-list {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 16px;
        }

        .order-card-header h2 {
            margin: 0 0 6px;
            font-size: 20px;
            color: #2c3e50;
        }

        .order-card-header p {
            margin: 0;
            color: #666;
        }

        .receipt-link {
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .receipt-link:hover {
            background: #3f9443;
        }

        .order-meta-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 16px;
        }

        .order-meta-grid div {
            background: #fafafa;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-label {
            color: #777;
            font-size: 13px;
        }

        .order-address {
            margin: 0;
            color: #444;
            line-height: 1.5;
        }

        .empty-orders {
            text-align: center;
            color: #777;
            padding: 80px 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        @media (max-width: 768px) {
            .orders-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-card-header {
                flex-direction: column;
            }

            .order-meta-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="orders-container">
        <div class="orders-header">
            <div>
                <h1>My Orders</h1>
                <p style="margin: 8px 0 0; color: #666;">All your recent orders and delivery estimates</p>
            </div>
            <a class="back-link" href="/Daily-Necessities/index.html">Back to Shop</a>
        </div>

        <div id="empty-orders" class="empty-orders" style="display:none;">
            <p style="font-size: 18px; margin-bottom: 12px;">No orders yet</p>
            <a href="/Daily-Necessities/index.html" style="color: #4CAF50; text-decoration: none;">Start shopping</a>
        </div>

        <div id="orders-list" class="orders-list"></div>
    </div>

    <script type="module" src="/Daily-Necessities/source/ordersPage.js"></script>
</body>
</html>
