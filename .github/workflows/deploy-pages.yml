name: Deploy GitHub Pages

on:
  push:
    branches:
      - head
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Pull Git LFS assets
        run: |
          git lfs install --local
          git lfs pull

      - name: Verify no LFS pointer files in image folders
        run: |
          if grep -RIl "https://git-lfs.github.com/spec/v1" product-images new-product-images 2>/dev/null; then
            echo "LFS pointer files detected in image folders. Failing build to prevent broken images on Pages."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p dist
          if [ -d docs ]; then
            cp -a docs/. dist/
          else
            rsync -a \
              --exclude 'dist' \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'node_modules' \
              ./ dist/
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4