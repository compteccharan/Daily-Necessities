<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdail - Checkout</title>
    <base href="/Daily-Necessities/">
    <link rel="stylesheet" href="/Daily-Necessities/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        .checkout-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .checkout-header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .checkout-header h1 {
            font-size: 32px;
            color: #2c3e50;
            margin: 0 0 10px 0;
        }

        .checkout-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .checkout-form {
            background: white;
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #e0e0e0;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 6px;
        }

        .terms-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: #27ae60;
        }

        .terms-group label {
            display: inline;
            margin: 0;
            line-height: 1.45;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkout-summary {
            background: white;
            border-radius: 8px;
            padding: 25px;
            height: fit-content;
            border: 1px solid #e0e0e0;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 15px;
            color: #555;
        }

        .summary-row.total {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }

        .payment-methods {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .payment-method {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .payment-method:hover {
            border-color: #4CAF50;
            background: #f9fff9;
        }

        .payment-method input[type="radio"] {
            width: auto;
            margin-right: 10px;
        }

        .payment-method input[type="radio"]:checked + label {
            font-weight: 600;
        }

        .place-order-btn {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
        }

        .place-order-btn:hover {
            background: #45a049;
        }

        .place-order-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .checkout-content {
                grid-template-columns: 1fr;
            }

            .checkout-summary {
                position: relative;
                top: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <p style="color: #666; margin: 0;">Complete your purchase</p>
        </div>

        <div id="success-message" class="success-message">
            ✓ Order placed successfully! Your order will be delivered soon.
        </div>

        <div id="error-message" class="error-message"></div>

        <div class="checkout-content">
            <!-- Checkout Form -->
            <form class="checkout-form" id="checkout-form">
                <!-- Delivery Address -->
                <div class="form-section">
                    <h2>Delivery Address</h2>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Street Address</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" required>
                        </div>
                        <div class="form-group">
                            <label>ZIP Code</label>
                            <input type="text" id="zipcode" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="state" required>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="form-section">
                    <h2>Payment Method</h2>
                    <div class="payment-methods">
                        <div class="payment-method">
                            <input type="radio" id="cod" name="payment_method" value="cod" checked>
                            <label for="cod">Cash on Delivery (COD)</label>
                        </div>
                        <div class="payment-method">
                            <input type="radio" id="card" name="payment_method" value="card">
                            <label for="card">Debit/Credit Card</label>
                        </div>
                        <div class="payment-method">
                            <input type="radio" id="upi" name="payment_method" value="upi">
                            <label for="upi">UPI Payment</label>
                        </div>
                    </div>
                    <div id="card-payment-fields" style="display:none; margin-top: 15px;">
                        <div class="form-group">
                            <label>Name on Card</label>
                            <input type="text" id="card-name" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" id="card-number" inputmode="numeric" autocomplete="off" placeholder="Demo card number">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Expiry</label>
                                <input type="text" id="card-expiry" autocomplete="off" placeholder="MM/YY">
                            </div>
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="password" id="card-cvv" inputmode="numeric" autocomplete="off" placeholder="123">
                            </div>
                        </div>
                    </div>
                    <div id="upi-payment-fields" style="display:none; margin-top: 15px;">
                        <div class="form-group">
                            <label>UPI ID</label>
                            <input type="text" id="upi-id" autocomplete="off" placeholder="name@bank">
                        </div>
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="form-section">
                    <div class="form-group">
                        <div class="terms-group">
                            <input type="checkbox" id="terms" required>
                            <label for="terms">I agree to the Terms & Conditions and Privacy Policy</label>
                        </div>
                    </div>
                </div>
            </form>

            <!-- Order Summary -->
            <div class="checkout-summary">
                <div class="summary-title">Order Summary</div>
                
                <div id="order-items-summary"></div>

                <div style="border-top: 1px solid #ddd; padding-top: 15px; margin-top: 15px;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="summary-subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (5%):</span>
                        <span id="summary-tax">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee:</span>
                        <span id="summary-delivery">Free</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total Amount:</span>
                        <span id="summary-total">₹0</span>
                    </div>
                </div>

                <button type="submit" form="checkout-form" class="place-order-btn" id="place-order-btn">
                    Place Order
                </button>

                <button type="button" class="place-order-btn" style="background: #2f7d32; margin-top: 10px;" onclick="goBackToCart()">
                    Back to Cart
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/Daily-Necessities/source/checkoutPage.js"></script>
</body>
</html>
